<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>
      Colaboradores
    </ion-title>
  </ion-toolbar>
  <ion-searchbar></ion-searchbar>
</ion-header>

<ion-content [fullscreen]="true">
  @if(sihay){
  <ion-fab slot="fixed" vertical="bottom" horizontal="end">
    <ion-fab-button (click)="addColab()">
      <ion-icon name="add"></ion-icon>
    </ion-fab-button>
  </ion-fab>
  <ion-list>
    <ion-item button detail="true">
      <ion-avatar slot="start">
        <img src="https://ionicframework.com/docs/img/demos/avatar.svg" />
      </ion-avatar>
      <ion-label>
        <h2>Ana García</h2>
        <p>Desarrolladora</p>
      </ion-label>
    </ion-item>
  </ion-list>
  }@else {
  <div class="welcome-container">

    <div class="ion-text-center">
      <ion-icon name="business-sharp" color="medium" style="font-size: 100px;">
      </ion-icon>

      <h1>
        <strong>Aun no hay colaboradores</strong>
      </h1>

      <p>
        Comienza añadiendo a tu primer colaborador
      </p>
    </div>

    <ion-button expand="block">
      Agregar Colaborador
    </ion-button>

  </div>
  }
</ion-content>
